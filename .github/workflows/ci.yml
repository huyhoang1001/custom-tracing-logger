name: CI

on:
  push:
    branches: [ main, test-commit ]
  pull_request:
    branches: [ main, test-commit ]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 1
  RUST_BACKTRACE: 1
  # Optimize for CI builds
  RUSTFLAGS: "-C codegen-units=16 -C debuginfo=0"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    
    - name: Install fast linker
      run: sudo apt-get update && sudo apt-get install -y lld
    
    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.4
    
    - name: Rust Cache (Optimized)
      uses: Swatinem/rust-cache@v2
      with:
        cache-targets: true
        cache-all-crates: true
    
    # Fastest checks first (fail fast)
    - name: Check formatting
      run: cargo fmt --all -- --check
    
    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings
    
    - name: Build (optimized)
      run: cargo build --profile ci
    
    - name: Test (parallel)
      run: |
        cargo install cargo-nextest
        cargo nextest run --profile ci
    
    - name: Build examples
      run: |
        cargo build --examples --profile ci
        cargo run --example simple_usage
        cargo run --example configuration
    
    - name: Show cache stats
      run: sccache --show-stats

  build:
    name: Multi-platform Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install fast linker (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          sudo apt-get update && sudo apt-get install -y lld
        elif [ "$RUNNER_OS" = "macOS" ]; then
          brew install llvm
        fi
    
    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.4
    
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        cache-targets: true
    
    - name: Build (optimized)
      run: cargo build --profile ci
      env:
        CARGO_INCREMENTAL: 1
        RUSTFLAGS: "-C codegen-units=16 -C debuginfo=0"